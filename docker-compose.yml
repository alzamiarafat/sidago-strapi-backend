name: sidago-strapi-backend

services:
  sidago-postgres:
    image: postgres:16-alpine
    container_name: sidago-postgres
    environment:
      POSTGRES_DB: sidago_strapi
      POSTGRES_USER: sidago
      POSTGRES_PASSWORD: sidago
    ports:
      - "5343:5432"
    volumes:
      - sidago-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidago -d sidago_strapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  sidago-strapi:
    image: sidago-strapi-backend:${IMAGE_TAG:-1}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sidago-strapi
    env_file:
      - .env
    environment:
      DATABASE_HOST: sidago-postgres
      DATABASE_PORT: 5432
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      sidago-postgres:
        condition: service_healthy
    ports:
      - "9012:9012"
    restart: always

volumes:
  sidago-postgres-data:
